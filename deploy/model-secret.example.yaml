# Keep the real API key out of Git. Render and apply this file once:
#   NAMESPACE=my-vm-namespace OPENAI_API_KEY=... \
#     envsubst < deploy/model-secret.example.yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: kubevirt-ai-agent-model
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: kubevirt-ai-agent
type: Opaque
stringData:
  api-key: "${OPENAI_API_KEY}"

